name: ShiftingBackrooms
version: 0.1.0
main: ru.backrooms.BackroomsPlugin
api-version: '1.21.4'
depend: [Citizens]
description: Procedural shifting Backrooms with player echoes.

commands:
  br:
    description: Управление Backrooms
    usage: /br <enter [0-23]|leave|levels|snapshot>

permissions:
  backrooms.use:
    description: Вход и выход из Backrooms
    default: true

  backrooms.admin:
    description: Обновление миниатюры исходного мира
    default: op
