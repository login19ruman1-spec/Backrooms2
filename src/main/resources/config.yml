# Используй отдельное, ранее не занятое обычным миром имя.
world-name: backrooms_shift
seed: 778013

miniature:
  source-world: world

shifting:
  enabled: true
  # Интервал между попытками изменить одну загруженную комнату.
  interval-ticks: 200
  # Не изменять комнаты рядом с настоящими игроками.
  safe-distance: 48

echoes:
  enabled: true
  max-active: 6
  spawn-interval-ticks: 600
  skins: true

# Посетители, снимок миниатюры и точки возвращения
